name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require Actions variables
        env:
          A: ${{ vars.VITE_API_URL }}
          B: ${{ vars.VITE_COGNITO_DOMAIN }}
          C: ${{ vars.VITE_CLIENT_ID }}
        run: |
          for v in A B C; do
            [ -n "${!v}" ] || { echo "::error::Missing repo variable VITE_API_URL / VITE_COGNITO_DOMAIN / VITE_CLIENT_ID (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          done
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # public identifiers, set under Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID }}
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
